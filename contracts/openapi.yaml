openapi: 3.1.0
info:
  title: tidyai
  version: 0.3.0
  description: |
    Live contract. Accounts follow docs/research/14-accounts-auth.md.
    Provider keys travel on X-Provider-Key, never in a JSON body.
    Flashcards are not in this version.

    Auth is an opaque session cookie (__Host-tidyai_session over https,
    tidyai_session on local http). Every POST, PATCH, PUT, DELETE needs
    X-Tidyai-Csrf: 1 and an allowed Origin, or the guard answers 403 bad_origin.
    Project, chat, page, and block routes need a session (401 without one)
    and answer 404 for ids the user does not own, same as for missing ids.
    Errors are {code, message}. Signup, forgot, and resend always answer 202
    so they do not reveal whether an email has an account.

    POST /v1/chats/{chatId}/turns is text/event-stream:
    text, status, notes (JSON list of page ids), error ({code, message}), done.
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Process is up. db is ok or down.
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status:
                    type: string
                  db:
                    type: string
                    enum: [ok, down]
  /v1/auth/config:
    get:
      operationId: authConfig
      responses:
        "200":
          description: Sign-in options the server supports
          content:
            application/json:
              schema:
                type: object
                required: [googleEnabled, passwordMin, passwordMax]
                properties:
                  googleEnabled:
                    type: boolean
                  passwordMin:
                    type: integer
                  passwordMax:
                    type: integer
  /v1/auth/signup:
    post:
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
                displayName:
                  type: string
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/auth/verify:
    post:
      operationId: verifyEmail
      description: Consumes the one-time token from the mailed link and signs the user in.
      requestBody:
        $ref: "#/components/requestBodies/Token"
      responses:
        "200":
          $ref: "#/components/responses/Me"
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/resend-verification:
    post:
      operationId: resendVerification
      requestBody:
        $ref: "#/components/requestBodies/Email"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "429":
          $ref: "#/components/responses/Error"
  /v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/Me"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          description: Email not verified (code email_unverified)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Session ended and cookie cleared
  /v1/auth/forgot:
    post:
      operationId: forgotPassword
      requestBody:
        $ref: "#/components/requestBodies/Email"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "429":
          $ref: "#/components/responses/Error"
  /v1/auth/reset:
    post:
      operationId: resetPassword
      description: Sets a new password, ends every session, does not sign in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /v1/auth/google/start:
    get:
      operationId: googleStart
      parameters:
        - name: next
          in: query
          schema:
            type: string
          description: Same-origin path to land on after sign-in. Anything else becomes /app.
      responses:
        "302":
          description: Redirect to Google with state, nonce, and PKCE S256
        "303":
          description: Google sign-in is not configured; back to /login?error=google_disabled
  /v1/auth/google/callback:
    get:
      operationId: googleCallback
      responses:
        "303":
          description: Signed in and sent to next, or sent to /login?error=google|google_unverified
  /v1/me:
    get:
      operationId: getMe
      responses:
        "200":
          $ref: "#/components/responses/Me"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      operationId: patchMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/Me"
    delete:
      operationId: deleteMe
      description: >
        Deletes the account and every project it owns. Needs the account email.
        Needs the password when the account has one. A Google-only account
        needs a session younger than 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmEmail]
              properties:
                confirmEmail:
                  type: string
                password:
                  type: string
      responses:
        "204":
          description: Account deleted and cookie cleared
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/me/password:
    post:
      operationId: changePassword
      description: Ends every other session. currentPassword is empty when the account has none yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        "204":
          description: Password changed
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/me/sessions:
    get:
      operationId: listSessions
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
  /v1/me/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{16}$"
      responses:
        "204":
          description: Session ended
        "400":
          description: That is the current session (use logout)
        "404":
          $ref: "#/components/responses/Error"
  /v1/me/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      responses:
        "200":
          description: Count of ended sessions
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: integer
  /v1/projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
      responses:
        "201":
          description: Created, with the root page id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /v1/projects/{projectId}/chats:
    get:
      operationId: listChats
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chat"
    post:
      operationId: createChat
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
  /v1/chats/{chatId}:
    patch:
      operationId: patchChat
      parameters:
        - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        "200":
          description: Updated chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "404":
          description: Chat not found
  /v1/chats/{chatId}/messages:
    get:
      operationId: listMessages
      parameters:
        - $ref: "#/components/parameters/ChatId"
      responses:
        "200":
          description: Messages in order
  /v1/chats/{chatId}/turns:
    post:
      operationId: createTurn
      parameters:
        - $ref: "#/components/parameters/ChatId"
        - $ref: "#/components/parameters/ProviderKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Turn"
      responses:
        "200":
          description: Server-sent events
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Missing provider key
  /v1/projects/{projectId}/pages:
    get:
      operationId: listPages
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Note pages
  /v1/projects/{projectId}/pages/{pageId}:
    get:
      operationId: getPage
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Page and blocks
  /v1/projects/{projectId}/pages/{pageId}/blocks:
    put:
      operationId: putPageBlocks
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocks]
              properties:
                blocks:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [id, type]
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      payload:
                        type: object
      responses:
        "200":
          description: Replaced ordered blocks for the page
        "400":
          description: Unknown type or bad payload
        "404":
          description: Page not found
        "409":
          description: A block id already lives on another page
  /v1/blocks/{blockId}:
    patch:
      operationId: patchBlock
      parameters:
        - name: blockId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, payload]
              properties:
                version:
                  type: integer
                payload:
                  type: object
      responses:
        "200":
          description: Updated block
        "409":
          description: Version conflict
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    ChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: string
    ProviderKey:
      name: X-Provider-Key
      in: header
      required: true
      schema:
        type: string
  requestBodies:
    Email:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email:
                type: string
    Token:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token:
                type: string
  responses:
    Accepted:
      description: Accepted. Same answer whether or not the email has an account.
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
    Error:
      description: Failure with a stable code
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Me:
      description: The signed-in user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/User"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    User:
      type: object
      required: [id, email, emailVerified, displayName, hasPassword, providers, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        displayName:
          type: string
        hasPassword:
          type: boolean
        providers:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    Session:
      type: object
      required: [id, current, createdAt, lastSeenAt]
      properties:
        id:
          type: string
        current:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        userAgent:
          type: string
        ip:
          type: string
    Project:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
        rootPageId:
          type: string
    Chat:
      type: object
      required: [id, projectId, title]
      properties:
        id:
          type: string
        projectId:
          type: string
        title:
          type: string
    Turn:
      type: object
      required: [text, protocol, baseUrl, model]
      properties:
        text:
          type: string
        protocol:
          type: string
          enum: [openai_chat, gemini]
        baseUrl:
          type: string
        model:
          type: string
        patchModel:
          type: string
        pageId:
          type: string
        embeddingModel:
          type: string
          description: Optional. Same protocol as the chat model. Empty means keyword search only.
        embeddingBaseUrl:
          type: string
          description: Optional. Defaults to baseUrl. The embedding key is the X-Embedding-Key header, not this body.
        mode:
          type: string
          enum: [notes, web]
          default: web
          description: >
            notes = answer from search_notes only, no note writes.
            web = provider web search, then note ops after the answer.
