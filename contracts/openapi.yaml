openapi: 3.1.0
info:
  title: tidyai
  version: 0.2.0
  description: |
    Live contract for the local single-user slice.
    Provider keys travel on X-Provider-Key, never in a JSON body.
    Flashcards are not in this version.

    POST /v1/chats/{chatId}/turns is text/event-stream:
    text, status, notes (JSON list of page ids), error ({code, message}), done.
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Process is up. db is ok or down.
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status:
                    type: string
                  db:
                    type: string
                    enum: [ok, down]
  /v1/projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
      responses:
        "201":
          description: Created, with the root page id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /v1/projects/{projectId}/chats:
    get:
      operationId: listChats
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chat"
    post:
      operationId: createChat
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
  /v1/chats/{chatId}/messages:
    get:
      operationId: listMessages
      parameters:
        - $ref: "#/components/parameters/ChatId"
      responses:
        "200":
          description: Messages in order
  /v1/chats/{chatId}/turns:
    post:
      operationId: createTurn
      parameters:
        - $ref: "#/components/parameters/ChatId"
        - $ref: "#/components/parameters/ProviderKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Turn"
      responses:
        "200":
          description: Server-sent events
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Missing provider key
  /v1/projects/{projectId}/pages:
    get:
      operationId: listPages
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Note pages
  /v1/projects/{projectId}/pages/{pageId}:
    get:
      operationId: getPage
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Page and blocks
  /v1/blocks/{blockId}:
    patch:
      operationId: patchBlock
      parameters:
        - name: blockId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, payload]
              properties:
                version:
                  type: integer
                payload:
                  type: object
      responses:
        "200":
          description: Updated block
        "409":
          description: Version conflict
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    ChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: string
    ProviderKey:
      name: X-Provider-Key
      in: header
      required: true
      schema:
        type: string
  schemas:
    Project:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
        rootPageId:
          type: string
    Chat:
      type: object
      required: [id, projectId, title]
      properties:
        id:
          type: string
        projectId:
          type: string
        title:
          type: string
    Turn:
      type: object
      required: [text, protocol, baseUrl, model]
      properties:
        text:
          type: string
        protocol:
          type: string
          enum: [openai_chat, gemini]
        baseUrl:
          type: string
        model:
          type: string
        patchModel:
          type: string
        pageId:
          type: string
