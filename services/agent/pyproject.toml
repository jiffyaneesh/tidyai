[project]
name = "tidyai-agent"
version = "0.1.0"
description = "Study-turn policy for tidyai. No HTTP and no database."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
